site_name: ML Notes
site_url: https://alexali04.github.io/notes/
theme:
  name: material
  custom_dir: overrides

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true


extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

hooks:
  - docs/hooks/number_admonitions.py
  - docs/hooks/bibtex_citations.py

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: iso_date        # or date, datetime, timeago
      fallback_to_build_date: false