site_name: ML Notes
site_url: https://alexali04.github.io/notes/
theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

markdown_extensions:
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - attr_list


extra_javascript:
  - javascripts/mathjax.js
  - javascripts/nav-toggle.js
  - javascripts/mathjax/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

hooks:
  - docs/hooks/number_admonitions.py
  - docs/hooks/bibtex_citations.py

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: iso_date        # or date, datetime, timeago
      fallback_to_build_date: false